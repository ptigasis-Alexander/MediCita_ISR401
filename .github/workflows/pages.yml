name: Deploy MediCita MVP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout solo 05_MVP
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            05_MVP
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload 05_MVP
        uses: actions/upload-pages-artifact@v4
        with:
          path: './05_MVP'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
